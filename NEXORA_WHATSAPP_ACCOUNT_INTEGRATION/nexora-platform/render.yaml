# NEXORA Render configuration
# Frontend: existing Render Static Site "nexora_referral"
# Backend: existing Render Web Service "nexora-api"
#
# If you use this file as a Render Blueprint, keep your existing secret
# environment variables on the API service. Static-site Vite variables are
# build-time values.

services:
  - type: web
    runtime: static
    name: nexora_referral
    buildCommand: npm install --prefix client && npm run build --prefix client
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nexora-api-shxf.onrender.com/api
